<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake</title>
  <style>
    :root {
      --bg:#1a1a2e; --cbg:#16213e; --cgrid:#1a2550;
      --text:#eee; --sub:#a0a0c0; --accent:#4ecca3; --acc2:#2d9e7e;
      --coin:#f5a623; --card:#1a2550; --border:#2a3570; --wall:#3a5a9a;
    }
    body.day {
      --bg:#f0f5f0; --cbg:#e4ede4; --cgrid:#c5ddc5;
      --text:#1a2e1a; --sub:#4a6a4a; --accent:#2d9e7e; --acc2:#1a7a5a;
      --coin:#d4800a; --card:#d8ecd8; --border:#9abf9a; --wall:#5a9a5a;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);display:flex;flex-direction:column;align-items:center;
      min-height:100vh;font-family:'Courier New',monospace;color:var(--text);
      padding:10px 6px 20px;overflow-x:hidden;transition:background .3s,color .3s;}

    h1{font-size:1.85rem;margin-bottom:4px;color:var(--accent);letter-spacing:4px;text-transform:uppercase;}

    #name-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:0.78rem;color:var(--sub);}
    #name-input{background:var(--card);border:1px solid var(--border);border-radius:4px;
      color:var(--text);font-family:inherit;font-size:0.78rem;padding:2px 7px;width:110px;}

    #scoreboard{display:flex;gap:1.1rem;margin-bottom:5px;font-size:0.8rem;color:var(--sub);
      flex-wrap:wrap;justify-content:center;}
    #scoreboard span{color:var(--accent);font-weight:bold;}
    #coins-display span{color:var(--coin);}
    #timer-display{color:#ff9944;} #timer-display span{color:#ff7700;font-weight:bold;}
    #p2score-display{color:#7799ff;} #p2score-display span{color:#7799ff;font-weight:bold;}

    /* mode / map tabs */
    #mode-tabs,#map-tabs{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap;justify-content:center;}
    .tab-btn{padding:3px 10px;font-family:inherit;font-size:0.74rem;font-weight:bold;
      border:1px solid var(--border);border-radius:3px;background:var(--card);
      color:var(--sub);cursor:pointer;transition:all .15s;}
    .tab-btn:hover{border-color:var(--accent);color:var(--text);}
    .tab-btn.active{background:var(--accent);color:var(--bg);border-color:var(--accent);}

    canvas#canvas{border:2px solid var(--accent);border-radius:4px;
      box-shadow:0 0 24px rgba(78,204,163,.22);display:block;max-width:100%;touch-action:none;}

    /* power-up bar */
    #pu-bar{width:400px;max-width:100%;background:var(--card);border:1px solid var(--border);
      border-radius:4px;margin-top:4px;display:flex;align-items:center;
      padding:3px 8px;gap:8px;font-size:0.73rem;color:var(--sub);min-height:22px;}
    #pu-fill{height:8px;border-radius:3px;flex-shrink:0;display:none;transition:width .12s linear;}

    #message{margin-top:6px;font-size:0.8rem;color:var(--sub);text-align:center;
      min-height:1.2em;padding:0 6px;}
    #message strong{color:var(--text);}

    #btn-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;justify-content:center;}
    .btn{padding:.42rem .9rem;background:var(--accent);color:var(--bg);border:none;
      border-radius:4px;font-size:0.78rem;font-family:inherit;font-weight:bold;
      cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:filter .15s;}
    .btn:hover{filter:brightness(1.15);}
    .btn:active{filter:brightness(.85);}
    .btn:focus{outline:2px solid var(--text);}

    #btn-pause{background:#6a6aaa;color:#fff;display:none;}
    #btn-shop{background:var(--coin);color:var(--bg);}
    #btn-scores{background:#9b59b6;color:#fff;}
    #btn-achiev{background:#c0392b;color:#fff;}
    #btn-theme{background:var(--card);color:var(--text);border:1px solid var(--border);}
    #btn-share{background:#2980b9;color:#fff;display:none;}

    /* D-pad */
    #dpad{display:none;margin-top:12px;position:relative;width:150px;height:150px;}
    .dpad-btn{position:absolute;width:46px;height:46px;background:rgba(78,204,163,.14);
      border:2px solid rgba(78,204,163,.4);border-radius:8px;display:flex;
      align-items:center;justify-content:center;font-size:1.3rem;
      cursor:pointer;user-select:none;-webkit-user-select:none;}
    .dpad-btn:active{background:rgba(78,204,163,.45);}
    #dpad-up{top:0;left:52px;} #dpad-down{bottom:0;left:52px;}
    #dpad-left{top:52px;left:0;} #dpad-right{top:52px;right:0;}
    @media(pointer:coarse){#dpad{display:flex;}}

    /* confetti overlay */
    #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:50;display:none;}

    /* modals */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);
      z-index:100;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--cbg);border:2px solid var(--accent);border-radius:10px;
      padding:18px;width:min(480px,96vw);max-height:90vh;overflow-y:auto;}
    .modal h2{color:var(--accent);text-align:center;margin-bottom:10px;letter-spacing:2px;}
    .modal-close{display:block;margin:12px auto 0;padding:.42rem 1.8rem;}

    /* shop */
    #skin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;}
    .skin-card{background:var(--card);border:2px solid var(--border);border-radius:8px;
      padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
      cursor:pointer;transition:border-color .15s;}
    .skin-card:hover{border-color:var(--accent);}
    .skin-card.selected{border-color:var(--accent);filter:brightness(1.12);}
    .skin-card.locked{opacity:.55;cursor:default;}
    .skin-card.locked:hover{border-color:var(--border);}
    .skin-name{font-size:0.68rem;color:var(--text);text-align:center;}
    .skin-badge{font-size:0.6rem;padding:2px 6px;border-radius:10px;font-weight:bold;}
    .badge-owned{background:#2d9e7e;color:#fff;}
    .badge-active{background:var(--accent);color:var(--bg);}
    .badge-buy{background:var(--coin);color:var(--bg);}

    /* leaderboard */
    #lb-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
    .lb-tab{padding:3px 10px;font-family:inherit;font-size:0.72rem;font-weight:bold;
      border:1px solid var(--border);border-radius:3px;background:var(--card);
      color:var(--sub);cursor:pointer;}
    .lb-tab.active{background:#9b59b6;color:#fff;border-color:#9b59b6;}
    .lb-row{display:flex;gap:8px;align-items:center;padding:5px 4px;
      border-bottom:1px solid var(--border);font-size:0.78rem;}
    .lb-rank{width:24px;font-weight:bold;color:var(--sub);}
    .lb-name{flex:1;color:var(--text);}
    .lb-score{color:var(--accent);font-weight:bold;width:56px;text-align:right;}
    .lb-info{font-size:0.65rem;color:var(--sub);width:80px;text-align:right;}

    /* achievements */
    .ach-list{display:flex;flex-direction:column;gap:6px;}
    .ach-row{display:flex;gap:10px;align-items:center;padding:8px;
      border-radius:6px;background:var(--card);border:1px solid var(--border);}
    .ach-row.unlocked{border-color:var(--accent);}
    .ach-icon{font-size:1.35rem;width:30px;text-align:center;}
    .ach-info{flex:1;}
    .ach-name{font-size:0.78rem;font-weight:bold;color:var(--text);}
    .ach-desc{font-size:0.67rem;color:var(--sub);}
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div id="name-row">
    👤 Naam: <input id="name-input" type="text" maxlength="16" placeholder="Jouw naam…">
  </div>

  <div id="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div>Highscore: <span id="highscore">0</span></div>
    <div>Level: <span id="level">1</span></div>
    <div id="coins-display">🪙 <span id="coins">0</span></div>
    <div id="timer-display" style="display:none">⏱ <span id="timer">60.0</span>s</div>
    <div id="p2score-display" style="display:none">P2: <span id="p2score">0</span></div>
  </div>

  <div id="mode-tabs">
    <button class="tab-btn active" data-mode="classic">Klassiek</button>
    <button class="tab-btn" data-mode="countdown">⏱ 60s</button>
    <button class="tab-btn" data-mode="hard">💀 Hard</button>
    <button class="tab-btn" data-mode="multi">👥 2-Speler</button>
  </div>
  <div id="map-tabs">
    <button class="tab-btn active" data-map="0">Open Veld</button>
    <button class="tab-btn" data-map="1">Kruis</button>
    <button class="tab-btn" data-map="2">Vakken</button>
    <button class="tab-btn" data-map="3">Doolhof</button>
  </div>

  <canvas id="canvas" width="400" height="400"></canvas>

  <div id="pu-bar">
    <span id="pu-label" style="min-width:96px">Geen power-up</span>
    <div id="pu-fill"></div>
  </div>

  <div id="message">Druk op <strong>Start</strong> om te spelen</div>

  <div id="btn-row">
    <button class="btn" id="btn-start">Start</button>
    <button class="btn" id="btn-pause">⏸ Pauze</button>
    <button class="btn" id="btn-share">📤 Delen</button>
    <button class="btn" id="btn-shop">🏪 Shop</button>
    <button class="btn" id="btn-scores">🏆 Scores</button>
    <button class="btn" id="btn-achiev">🏅 Prestaties</button>
    <button class="btn" id="btn-theme">☀️ Dag</button>
  </div>

  <div id="dpad">
    <div class="dpad-btn" id="dpad-up">▲</div>
    <div class="dpad-btn" id="dpad-down">▼</div>
    <div class="dpad-btn" id="dpad-left">◀</div>
    <div class="dpad-btn" id="dpad-right">▶</div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <!-- Shop -->
  <div class="modal-overlay" id="shop-overlay">
    <div class="modal">
      <h2>🏪 Skin Shop</h2>
      <div style="text-align:center;color:var(--coin);font-size:0.82rem;margin-bottom:10px">
        Munten: <span id="shop-coins">0</span>
      </div>
      <div id="skin-grid"></div>
      <button class="btn modal-close" id="shop-close">Sluiten</button>
    </div>
  </div>

  <!-- Leaderboard -->
  <div class="modal-overlay" id="lb-overlay">
    <div class="modal">
      <h2>🏆 Scorebord</h2>
      <div id="lb-tabs"></div>
      <div id="lb-list"></div>
      <button class="btn modal-close" id="lb-close">Sluiten</button>
    </div>
  </div>

  <!-- Achievements -->
  <div class="modal-overlay" id="ach-overlay">
    <div class="modal">
      <h2>🏅 Prestaties</h2>
      <div class="ach-list" id="ach-list"></div>
      <button class="btn modal-close" id="ach-close">Sluiten</button>
    </div>
  </div>

  <script>
  /* ════════════════════════════════════════════════════════════
     CANVAS & CONSTANTS
  ════════════════════════════════════════════════════════════ */
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GRID = 20, COLS = W/GRID, ROWS = H/GRID;

  /* ════════════════════════════════════════════════════════════
     THEME
  ════════════════════════════════════════════════════════════ */
  let dayMode = false;
  const TC = {
    night:{ bg:'#16213e', grid:'#1a2550', wall:'#3a5a9a', wallEdge:'#1a2a6a' },
    day:  { bg:'#e4ede4', grid:'#c5ddc5', wall:'#5a9a5a', wallEdge:'#3a7a3a' },
  };
  function T() { return dayMode ? TC.day : TC.night; }

  /* ════════════════════════════════════════════════════════════
     AUDIO
  ════════════════════════════════════════════════════════════ */
  let aCtx = null;
  function getAC() {
    if (!aCtx) aCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (aCtx.state==='suspended') aCtx.resume();
    return aCtx;
  }
  function tone(f, type, dur, vol, delay=0) {
    try {
      const ac=getAC(), o=ac.createOscillator(), g=ac.createGain();
      o.connect(g); g.connect(ac.destination);
      o.type=type; o.frequency.value=f;
      const t=ac.currentTime+delay;
      g.gain.setValueAtTime(.001,t);
      g.gain.linearRampToValueAtTime(vol,t+.01);
      g.gain.exponentialRampToValueAtTime(.001,t+dur);
      o.start(t); o.stop(t+dur+.05);
    } catch(_){}
  }
  const SFX = {
    eat:     ()=>{ tone(523,'square',.07,.18); tone(784,'square',.07,.14,.06); },
    p2eat:   ()=>{ tone(440,'square',.07,.15); tone(660,'square',.07,.12,.06); },
    bonus:   ()=>[ 523,659,784,1047 ].forEach((f,i)=>tone(f,'sine',.11,.22,i*.07)),
    levelup: ()=>[ 330,415,494,659,830 ].forEach((f,i)=>tone(f,'sine',.12,.2,i*.09)),
    over:    ()=>[ 330,277,220,185,147 ].forEach((f,i)=>tone(f,'sawtooth',.18,.28,i*.11)),
    pu:      ()=>{ tone(880,'sine',.06,.2); tone(1100,'sine',.1,.18,.05); },
  };

  /* ════════════════════════════════════════════════════════════
     SKINS
  ════════════════════════════════════════════════════════════ */
  const RAINBOW = ['#ff4444','#ff9900','#ffee00','#44cc44','#4499ff','#9944ff'];
  const SKINS = [
    {id:'classic', name:'Klassiek',   price:0,   head:'#4ecca3', body:'#2d9e7e', eye:'#1a1a2e'},
    {id:'fire',    name:'Vuur',       price:80,  head:'#ff4500', body:'#cc2200', eye:'#ffee00'},
    {id:'ocean',   name:'Oceaan',     price:80,  head:'#00bfff', body:'#0077cc', eye:'#ffffff'},
    {id:'gold',    name:'Goud',       price:150, head:'#ffd700', body:'#b8960c', eye:'#1a1a2e'},
    {id:'galaxy',  name:'Galaxy',     price:200, head:'#9b59b6', body:'#6c3483', eye:'#4ecca3'},
    {id:'ibis',    name:'Ibis Vogel', price:250, head:'#ff6eb4', body:'#d63a8a', eye:'#ffffff', beak:true},
    {id:'rainbow', name:'Regenboog',  price:300, head:null,      body:null,      eye:'#ffffff'},
  ];
  const P2_SKIN = {head:'#7799ff', body:'#3355cc', eye:'#ffffff'};

  /* ════════════════════════════════════════════════════════════
     MAPS
  ════════════════════════════════════════════════════════════ */
  const MAPS = [
    { name:'Open Veld', obs:[] },
    { name:'Kruis', obs:(()=>{
        const o=[];
        for(let x=6;x<=14;x++) o.push({x,y:10});
        for(let y=6;y<=14;y++) if(y!==10) o.push({x:10,y});
        return o;
      })()
    },
    { name:'Vakken', obs:(()=>{
        const o=[];
        [[2,2],[15,2],[2,15],[15,15]].forEach(([bx,by])=>{
          for(let dx=0;dx<3;dx++) for(let dy=0;dy<3;dy++) o.push({x:bx+dx,y:by+dy});
        });
        return o;
      })()
    },
    { name:'Doolhof', obs:(()=>{
        const o=[];
        for(let x=3;x<=8;x++)   o.push({x,y:5});
        for(let y=5;y<=9;y++)   o.push({x:3,y});
        for(let x=11;x<=16;x++) o.push({x,y:14});
        for(let y=10;y<=14;y++) o.push({x:16,y});
        for(let x=7;x<=12;x++)  o.push({x,y:9});
        return o;
      })()
    },
  ];

  /* ════════════════════════════════════════════════════════════
     POWER-UPS
  ════════════════════════════════════════════════════════════ */
  const PU_TYPES = {
    slow:   {sym:'🐢', label:'Langzaam!',      color:'#44aaff', dur:6000},
    ghost:  {sym:'👻', label:'Door muren!',     color:'#bb88ff', dur:7000},
    double: {sym:'2×', label:'Dubbele punten!', color:'#ff44cc', dur:8000},
  };
  let fieldPU  = null;   // {type,x,y} — power-up sitting on the field
  let activePU = null;   // {type,expiresAt,timerId} — currently active

  function applyPU(type) {
    if (activePU) clearTimeout(activePU.timerId);
    const info = PU_TYPES[type];
    const timerId = setTimeout(()=>{
      activePU = null;
      if (type==='slow') restartInterval();
      refreshPUBar();
    }, info.dur);
    activePU = {type, expiresAt:Date.now()+info.dur, timerId};
    fieldPU  = null;
    SFX.pu();
    if (type==='slow') { clearInterval(stepInterval); stepInterval=setInterval(doStep,speed*2); }
    refreshPUBar();
  }

  function refreshPUBar() {
    const label=document.getElementById('pu-label'), fill=document.getElementById('pu-fill');
    if (!activePU) { label.textContent='Geen power-up'; fill.style.display='none'; return; }
    const info=PU_TYPES[activePU.type];
    label.textContent=info.sym+' '+info.label;
    fill.style.display='block'; fill.style.background=info.color;
    const pct=((activePU.expiresAt-Date.now())/info.dur)*200;
    fill.style.width=Math.max(0,pct)+'px';
  }

  /* ════════════════════════════════════════════════════════════
     ACHIEVEMENTS
  ════════════════════════════════════════════════════════════ */
  const ACHIEVEMENTS = [
    {id:'eat10',    icon:'🍎', name:'Snackbar',    desc:'Eet 10 stuks voedsel in totaal'},
    {id:'eat50',    icon:'🍽️', name:'Gulzigaard',  desc:'Eet 50 stuks voedsel in totaal'},
    {id:'survive5', icon:'⏰', name:'Veteraan',     desc:'Overleef 5 minuten in één spel'},
    {id:'level5',   icon:'🚀', name:'Schicht',      desc:'Bereik level 5'},
    {id:'bonus10',  icon:'⭐', name:'Bonusjager',   desc:'Verzamel 10 bonussterren'},
    {id:'pu5',      icon:'⚡', name:'Krachtpatser', desc:'Gebruik 5 power-ups'},
    {id:'score500', icon:'💯', name:'Vijfhonderd',  desc:'Behaal 500 punten in één spel'},
    {id:'hs',       icon:'👑', name:'Legende',      desc:'Verbeter je eigen highscore'},
  ];

  function checkAchievements() {
    let newUnlock = false;
    ACHIEVEMENTS.forEach(a=>{
      if (save.achievements.includes(a.id)) return;
      let ok=false;
      if (a.id==='eat10'    && save.stats.food>=10)       ok=true;
      if (a.id==='eat50'    && save.stats.food>=50)       ok=true;
      if (a.id==='survive5' && save.stats.maxTime>=300)   ok=true;
      if (a.id==='level5'   && save.stats.maxLevel>=5)    ok=true;
      if (a.id==='bonus10'  && save.stats.bonus>=10)      ok=true;
      if (a.id==='pu5'      && save.stats.powerups>=5)    ok=true;
      if (a.id==='score500' && score>=500)                ok=true;
      if (a.id==='hs'       && save.stats.beatHS)         ok=true;
      if (ok) { save.achievements.push(a.id); newUnlock=true; }
    });
    if (newUnlock) { writeSave(save); showAchToast(); }
  }

  let toastTimer=null;
  function showAchToast(){
    clearTimeout(toastTimer);
    document.getElementById('message').innerHTML='🏅 <strong>Prestatie behaald!</strong> Klik 🏅 om te bekijken.';
    toastTimer=setTimeout(()=>updateMsg(null),3500);
  }

  /* ════════════════════════════════════════════════════════════
     CONFETTI
  ════════════════════════════════════════════════════════════ */
  const cCvs=document.getElementById('confetti-canvas');
  const cCtx=cCvs.getContext('2d');
  let cParts=[], cRAF=null;
  const C_COLORS=['#ff4444','#44aaff','#44ee44','#ffee44','#ee44ee','#ff9900','#4ecca3'];

  function startConfetti(){
    cCvs.width=window.innerWidth; cCvs.height=window.innerHeight;
    cCvs.style.display='block';
    cParts=Array.from({length:130},()=>({
      x:Math.random()*cCvs.width, y:-20,
      vy:2+Math.random()*4, vx:(Math.random()-.5)*3,
      rot:Math.random()*360, rotV:(Math.random()-.5)*8,
      color:C_COLORS[Math.floor(Math.random()*C_COLORS.length)],
      w:7+Math.random()*8, h:4+Math.random()*5,
    }));
    if(cRAF) cancelAnimationFrame(cRAF);
    animConfetti();
    setTimeout(stopConfetti,3800);
  }
  function animConfetti(){
    cCtx.clearRect(0,0,cCvs.width,cCvs.height);
    cParts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV; p.vy+=.06;
      cCtx.save(); cCtx.translate(p.x,p.y); cCtx.rotate(p.rot*Math.PI/180);
      cCtx.fillStyle=p.color; cCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      cCtx.restore();
    });
    cParts=cParts.filter(p=>p.y<cCvs.height+30);
    if(cParts.length>0) cRAF=requestAnimationFrame(animConfetti); else stopConfetti();
  }
  function stopConfetti(){
    if(cRAF){cancelAnimationFrame(cRAF);cRAF=null;}
    cCvs.style.display='none'; cCtx.clearRect(0,0,cCvs.width,cCvs.height);
  }

  /* ════════════════════════════════════════════════════════════
     SAVE / LOAD
  ════════════════════════════════════════════════════════════ */
  function loadSave(){try{return JSON.parse(localStorage.getItem('snake_save')||'{}');}catch{return {};}}
  function writeSave(d){localStorage.setItem('snake_save',JSON.stringify(d));}

  let save=loadSave();
  save.highscore    = save.highscore    || parseInt(localStorage.getItem('snake_hs')||'0');
  save.coins        = save.coins        || 0;
  save.owned        = save.owned        || ['classic'];
  save.skin         = save.skin         || 'classic';
  save.name         = save.name         || '';
  save.leaderboard  = save.leaderboard  || [];
  save.achievements = save.achievements || [];
  save.stats        = save.stats        || {food:0,bonus:0,powerups:0,maxLevel:0,maxTime:0,beatHS:false};
  writeSave(save);

  document.getElementById('name-input').value = save.name;
  document.getElementById('name-input').addEventListener('change', e=>{
    save.name=(e.target.value.trim()||'Speler'); writeSave(save);
  });

  /* ════════════════════════════════════════════════════════════
     GAME STATE
  ════════════════════════════════════════════════════════════ */
  let selectedMode='classic', selectedMap=0;  // what the UI shows
  let gameMode='classic', mapIndex=0;          // what the running game uses

  let snake, prevSnake, dir, nextDir;
  let snake2, prevSnake2, dir2, nextDir2, score2;   // multiplayer
  let obstacles=[], food, bonus;
  let score, level, speed, state, paused;
  let stepInterval=null, rafId=null, lastStepTime=0, gameStartTime=0;
  const COUNTDOWN_SECS=60;

  function getSkin(){return SKINS.find(s=>s.id===save.skin)||SKINS[0];}

  function randomCell(exclude=[]){
    let c, tries=0;
    do{ c={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}; tries++; }
    while(tries<500&&(exclude.some(e=>e.x===c.x&&e.y===c.y)||obstacles.some(o=>o.x===c.x&&o.y===c.y)));
    return c;
  }
  function isObs(x,y){return obstacles.some(o=>o.x===x&&o.y===y);}

  function initGame(){
    gameMode  = selectedMode;
    mapIndex  = selectedMap;
    obstacles = MAPS[mapIndex].obs;

    snake     = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
    prevSnake = snake.map(s=>({...s}));
    dir       = {x:1,y:0}; nextDir={x:1,y:0};

    if(gameMode==='multi'){
      snake2     = [{x:15,y:10},{x:16,y:10},{x:17,y:10}];
      prevSnake2 = snake2.map(s=>({...s}));
      dir2={x:-1,y:0}; nextDir2={x:-1,y:0}; score2=0;
    }

    food    = randomCell([...snake,...(snake2||[])]);
    bonus   = null;
    fieldPU = null;
    if(activePU){clearTimeout(activePU.timerId);activePU=null;}

    score         = 0;
    level         = 1;
    speed         = gameMode==='hard' ? 80 : 150;
    state         = 'playing';
    paused        = false;
    gameStartTime = Date.now();
    save.stats.beatHS = false;

    updateUI();
    updatePauseBtn();
    refreshPUBar();
    document.getElementById('timer-display').style.display   = gameMode==='countdown'?'':'none';
    document.getElementById('p2score-display').style.display = gameMode==='multi'?'':'none';
    document.getElementById('btn-share').style.display       = 'none';
  }

  function updateUI(){
    document.getElementById('score').textContent      = score;
    document.getElementById('level').textContent      = level;
    document.getElementById('highscore').textContent  = save.highscore;
    document.getElementById('coins').textContent      = save.coins;
    document.getElementById('shop-coins').textContent = save.coins;
    if(gameMode==='multi') document.getElementById('p2score').textContent=score2||0;
  }

  function updateMsg(html){
    if(html!==null) document.getElementById('message').innerHTML=html||'';
  }
  function updatePauseBtn(){
    const btn=document.getElementById('btn-pause');
    if(state!=='playing'){btn.style.display='none';return;}
    btn.style.display='';
    btn.textContent=paused?'▶ Verder':'⏸ Pauze';
  }

  /* ════════════════════════════════════════════════════════════
     DRAWING
  ════════════════════════════════════════════════════════════ */
  function lerp(a,b,t){return a+(b-a)*t;}
  function segPad(){return Math.max(.5,2-(level-1)*.22);}  // thicker per level

  function drawGrid(){
    ctx.fillStyle=T().bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=T().grid; ctx.lineWidth=.4;
    for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*GRID,0);ctx.lineTo(x*GRID,H);ctx.stroke();}
    for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*GRID);ctx.lineTo(W,y*GRID);ctx.stroke();}
  }

  function drawObstacles(){
    obstacles.forEach(o=>{
      ctx.fillStyle=T().wall;
      ctx.fillRect(o.x*GRID,o.y*GRID,GRID,GRID);
      ctx.strokeStyle=T().wallEdge; ctx.lineWidth=1;
      ctx.strokeRect(o.x*GRID+.5,o.y*GRID+.5,GRID-1,GRID-1);
    });
  }

  function drawCellPx(px,py,color,radius=3,alpha=1){
    const pad=segPad();
    ctx.globalAlpha=alpha; ctx.fillStyle=color;
    ctx.beginPath();
    ctx.roundRect(px+pad,py+pad,GRID-pad*2,GRID-pad*2,radius);
    ctx.fill(); ctx.globalAlpha=1;
  }

  function drawIbisBeak(cx,cy){
    const bL=10,bW=3; ctx.fillStyle='#ff8c00'; ctx.beginPath();
    if(dir.x===1)       {ctx.moveTo(cx+GRID/2,cy-bW);ctx.lineTo(cx+GRID/2+bL,cy);ctx.lineTo(cx+GRID/2,cy+bW);}
    else if(dir.x===-1) {ctx.moveTo(cx-GRID/2,cy-bW);ctx.lineTo(cx-GRID/2-bL,cy);ctx.lineTo(cx-GRID/2,cy+bW);}
    else if(dir.y===-1) {ctx.moveTo(cx-bW,cy-GRID/2);ctx.lineTo(cx,cy-GRID/2-bL);ctx.lineTo(cx+bW,cy-GRID/2);}
    else                {ctx.moveTo(cx-bW,cy+GRID/2);ctx.lineTo(cx,cy+GRID/2+bL);ctx.lineTo(cx+bW,cy+GRID/2);}
    ctx.closePath(); ctx.fill();
  }

  function drawOneSnake(snk,prev,d,skin,t,isP2=false){
    const ghost = !isP2 && activePU && activePU.type==='ghost';
    snk.forEach((seg,i)=>{
      const p=prev[i]||seg;
      const px=lerp(p.x,seg.x,t)*GRID, py=lerp(p.y,seg.y,t)*GRID;
      let c;
      if(skin.id==='rainbow') c=RAINBOW[i%RAINBOW.length];
      else c=i===0?skin.head:skin.body;
      drawCellPx(px,py,c,i===0?5:3,ghost?.5:1);
    });
    const ph=prev[0]||snk[0];
    const cx=lerp(ph.x,snk[0].x,t)*GRID+GRID/2, cy=lerp(ph.y,snk[0].y,t)*GRID+GRID/2;
    if(!isP2&&skin.beak) drawIbisBeak(cx,cy);
    ctx.globalAlpha=ghost?.5:1;
    ctx.fillStyle=isP2?P2_SKIN.eye:(skin.eye||'#1a1a2e');
    const off=4;
    if(d.x!==0){
      ctx.beginPath();ctx.arc(cx+d.x*3,cy-off,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+d.x*3,cy+off,3,0,Math.PI*2);ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(cx-off,cy+d.y*3,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+off,cy+d.y*3,3,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  function drawFood(ts=0){
    const s=1+.12*Math.sin(ts/480*Math.PI*2);
    ctx.fillStyle='#e94560'; ctx.beginPath();
    ctx.arc(food.x*GRID+GRID/2,food.y*GRID+GRID/2,(GRID/2-2)*s,0,Math.PI*2);
    ctx.fill();
  }
  function drawBonus(ts=0){
    if(!bonus) return;
    const s=1+.18*Math.sin(ts/280*Math.PI*2);
    ctx.fillStyle='#f5a623'; ctx.beginPath();
    ctx.arc(bonus.x*GRID+GRID/2,bonus.y*GRID+GRID/2,(GRID/2-2)*s,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 11px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('★',bonus.x*GRID+GRID/2,bonus.y*GRID+GRID/2);
  }
  function drawFieldPU(ts=0){
    if(!fieldPU) return;
    const info=PU_TYPES[fieldPU.type];
    const s=1+.15*Math.sin(ts/360*Math.PI*2);
    ctx.fillStyle=info.color; ctx.globalAlpha=.88; ctx.beginPath();
    ctx.arc(fieldPU.x*GRID+GRID/2,fieldPU.y*GRID+GRID/2,(GRID/2-2)*s,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff'; ctx.font='bold 11px Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(info.sym,fieldPU.x*GRID+GRID/2,fieldPU.y*GRID+GRID/2);
  }
  function drawPauseOverlay(){
    ctx.fillStyle='rgba(22,33,62,.78)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#4ecca3'; ctx.font='bold 22px Courier New';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('⏸  GEPAUZEERD',W/2,H/2);
    ctx.font='13px Courier New'; ctx.fillStyle='#a0a0c0';
    ctx.fillText('Spatiebalk of ▶ Verder om door te gaan',W/2,H/2+34);
  }

  /* ════════════════════════════════════════════════════════════
     RAF RENDER LOOP
  ════════════════════════════════════════════════════════════ */
  function renderLoop(ts){
    if(state==='playing'){
      const t=paused?1:Math.min(1,(ts-lastStepTime)/speed);
      drawGrid(); drawObstacles();
      drawFood(ts); drawBonus(ts); drawFieldPU(ts);
      drawOneSnake(snake,prevSnake,dir,getSkin(),t);
      if(gameMode==='multi') drawOneSnake(snake2,prevSnake2,dir2,P2_SKIN,t,true);
      // Countdown visual
      if(gameMode==='countdown'){
        const rem=Math.max(0,COUNTDOWN_SECS-(Date.now()-gameStartTime)/1000);
        document.getElementById('timer').textContent=rem.toFixed(1);
        if(rem<10){ ctx.fillStyle=`rgba(233,69,96,${.08*(1+Math.sin(ts/120))})`; ctx.fillRect(0,0,W,H); }
      }
      if(paused) drawPauseOverlay();
      refreshPUBar();
    }
    rafId=requestAnimationFrame(renderLoop);
  }

  /* ════════════════════════════════════════════════════════════
     GAME LOGIC
  ════════════════════════════════════════════════════════════ */
  function wrapOrKill(h){
    if(activePU&&activePU.type==='ghost'){
      h.x=(h.x+COLS)%COLS; h.y=(h.y+ROWS)%ROWS; return false; // can't die by wall
    }
    if(h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS) return true;
    if(isObs(h.x,h.y)) return true;
    return false;
  }
  function selfCollide(h,snk){return snk.some(s=>s.x===h.x&&s.y===h.y);}

  function tryEat(head,snk,isP2){
    let ate=false;
    if(head.x===food.x&&head.y===food.y){
      ate=true;
      const pts=10*level*((!isP2&&activePU&&activePU.type==='double')?2:1);
      if(isP2) score2+=pts; else score+=pts;
      save.coins+=level; save.stats.food++;
      isP2?SFX.p2eat():SFX.eat();
      food=randomCell([...snake,...(snake2||[])]);
      if(!isP2&&!bonus&&save.stats.food%5===0){
        bonus=randomCell([...snake,...(snake2||[]),food]);
        setTimeout(()=>{bonus=null;},5000);
      }
      // Spawn power-up occasionally in non-multi single-player
      if(!isP2&&gameMode!=='multi'&&!fieldPU&&!activePU&&Math.random()<.22){
        const types=Object.keys(PU_TYPES);
        fieldPU={type:types[Math.floor(Math.random()*types.length)],
                 ...randomCell([...snake,food])};
      }
      if(!isP2){
        const nl=Math.floor(score/100)+1;
        if(nl>level){
          level=nl; speed=Math.max(gameMode==='hard'?40:60,150-(level-1)*15-(gameMode==='hard'?20:0));
          SFX.levelup();
          save.stats.maxLevel=Math.max(save.stats.maxLevel,level);
          if(!activePU||activePU.type!=='slow') restartInterval();
        }
        if(score>save.highscore){
          if(!save.stats.beatHS){startConfetti();save.stats.beatHS=true;}
          save.highscore=score;
        }
      }
      writeSave(save); checkAchievements(); updateUI();
    }
    if(!isP2&&bonus&&head.x===bonus.x&&head.y===bonus.y){
      ate=true;
      const pts=30*level*(activePU&&activePU.type==='double'?2:1);
      score+=pts; save.coins+=5*level; save.stats.bonus++;
      bonus=null; SFX.bonus();
      if(score>save.highscore){if(!save.stats.beatHS){startConfetti();save.stats.beatHS=true;}save.highscore=score;}
      writeSave(save); checkAchievements(); updateUI();
    }
    if(!isP2&&fieldPU&&head.x===fieldPU.x&&head.y===fieldPU.y){
      save.stats.powerups++;
      applyPU(fieldPU.type);
      writeSave(save); checkAchievements(); updateUI();
      // eating a power-up also slightly grows snake (rewarding)
      ate=true;
    }
    return ate;
  }

  function doStep(){
    if(paused) return;

    // Countdown end
    if(gameMode==='countdown'&&Date.now()-gameStartTime>=COUNTDOWN_SECS*1000) return gameOver();

    prevSnake    = snake.map(s=>({...s}));
    lastStepTime = performance.now();
    dir          = {...nextDir};
    const h1     = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    // ── MULTIPLAYER ──
    if(gameMode==='multi'){
      prevSnake2 = snake2.map(s=>({...s}));
      dir2       = {...nextDir2};
      const h2   = {x:snake2[0].x+dir2.x, y:snake2[0].y+dir2.y};

      const d1 = wrapOrKill(h1)||selfCollide(h1,snake)||selfCollide(h1,snake2);
      const d2 = wrapOrKill(h2)||selfCollide(h2,snake2)||selfCollide(h2,snake);

      if(d1&&d2) return endMulti('draw');
      if(d1)      return endMulti('p2');
      if(d2)      return endMulti('p1');

      snake.unshift(h1); snake2.unshift(h2);
      const ate1=tryEat(h1,snake,false);
      const ate2=tryEat(h2,snake2,true);
      if(!ate1) snake.pop();
      if(!ate2) snake2.pop();
      return;
    }

    // ── SINGLE PLAYER ──
    const wallDead = wrapOrKill(h1);
    if(wallDead||selfCollide(h1,snake)) return gameOver();

    snake.unshift(h1);
    if(!tryEat(h1,snake,false)) snake.pop();
  }

  function endMulti(winner){
    state='gameover'; clearInterval(stepInterval);
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    SFX.over();
    if(winner==='draw') updateMsg('Gelijkspel! 🤝');
    else if(winner==='p1') updateMsg(`🏆 Speler 1 wint! Score: <strong>${score}</strong>`);
    else updateMsg(`🏆 Speler 2 wint! Score: <strong>${score2}</strong>`);
    // Final draw
    drawGrid(); drawObstacles(); drawFood(); drawBonus(); drawFieldPU();
    drawOneSnake(snake,prevSnake,dir,getSkin(),1);
    drawOneSnake(snake2,prevSnake2,dir2,P2_SKIN,1,true);
    ctx.fillStyle='rgba(22,33,62,.5)'; ctx.fillRect(0,0,W,H);
    document.getElementById('btn-start').textContent='Opnieuw';
    document.getElementById('btn-share').style.display='';
    updatePauseBtn(); submitLB();
  }

  function gameOver(){
    state='gameover'; clearInterval(stepInterval);
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    if(activePU){clearTimeout(activePU.timerId);activePU=null;}
    SFX.over();
    const elapsed=(Date.now()-gameStartTime)/1000;
    save.stats.maxTime=Math.max(save.stats.maxTime,elapsed);
    writeSave(save); checkAchievements();
    // Final draw
    drawGrid(); drawObstacles(); drawFood(); drawBonus(); drawFieldPU();
    drawOneSnake(snake,prevSnake,dir,getSkin(),1);
    ctx.fillStyle='rgba(233,69,96,.24)'; ctx.fillRect(0,0,W,H);
    const tag=gameMode==='countdown'?' (60s)':gameMode==='hard'?' (hard)':'';
    updateMsg(`Game over! Score: <strong>${score}</strong>${tag} &nbsp;|&nbsp; 🪙 ${save.coins}`);
    document.getElementById('btn-start').textContent='Opnieuw';
    document.getElementById('btn-share').style.display='';
    updatePauseBtn(); submitLB();
  }

  function restartInterval(){ clearInterval(stepInterval); stepInterval=setInterval(doStep,speed); }

  function startGame(){
    clearInterval(stepInterval);
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    const nameVal=document.getElementById('name-input').value.trim();
    if(nameVal){save.name=nameVal;writeSave(save);}
    initGame();
    lastStepTime=performance.now();
    stepInterval=setInterval(doStep,speed);
    rafId=requestAnimationFrame(renderLoop);
    const ctrl=gameMode==='multi'
      ?'P1: <strong>WASD</strong> &nbsp;|&nbsp; P2: <strong>Pijltjestoetsen</strong>'
      :'<strong>Pijltjestoetsen</strong>, <strong>WASD</strong> of swipe';
    updateMsg(ctrl);
    document.getElementById('btn-start').textContent='Opnieuw';
  }

  function togglePause(){
    if(state!=='playing') return;
    paused=!paused;
    if(!paused) lastStepTime=performance.now();
    updatePauseBtn();
  }

  /* ════════════════════════════════════════════════════════════
     LEADERBOARD
  ════════════════════════════════════════════════════════════ */
  function submitLB(){
    const s=gameMode==='multi'?Math.max(score,score2||0):score;
    if(s<5) return;
    save.leaderboard.push({name:save.name||'Speler',score:s,mode:gameMode,level,
      date:new Date().toLocaleDateString('nl-NL')});
    save.leaderboard.sort((a,b)=>b.score-a.score);
    if(save.leaderboard.length>50) save.leaderboard.length=50;
    writeSave(save);
  }

  function renderLB(mode){
    const list=document.getElementById('lb-list');
    const entries=save.leaderboard.filter(e=>mode==='all'||e.mode===mode);
    if(!entries.length){
      list.innerHTML='<p style="text-align:center;color:var(--sub);margin:10px 0">Nog geen scores.</p>';return;
    }
    list.innerHTML=entries.slice(0,10).map((e,i)=>`
      <div class="lb-row">
        <div class="lb-rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
        <div class="lb-name">${e.name}</div>
        <div class="lb-score">${e.score}</div>
        <div class="lb-info">${e.mode}·L${e.level}</div>
      </div>`).join('');
  }

  function openLB(){
    const modes=['all','classic','countdown','hard','multi'];
    const labels=['Alle','Klassiek','60s','Hard','2P'];
    let cur='all';
    const tabs=document.getElementById('lb-tabs');
    tabs.innerHTML=modes.map((m,i)=>`<button class="lb-tab${m===cur?' active':''}" data-m="${m}">${labels[i]}</button>`).join('');
    tabs.querySelectorAll('.lb-tab').forEach(b=>{
      b.addEventListener('click',()=>{
        tabs.querySelectorAll('.lb-tab').forEach(x=>x.classList.remove('active'));
        b.classList.add('active'); renderLB(b.dataset.m);
      });
    });
    renderLB('all');
    document.getElementById('lb-overlay').classList.add('open');
  }

  /* ════════════════════════════════════════════════════════════
     SHOP RENDER
  ════════════════════════════════════════════════════════════ */
  function renderShop(){
    document.getElementById('shop-coins').textContent=save.coins;
    const grid=document.getElementById('skin-grid'); grid.innerHTML='';
    SKINS.forEach(skin=>{
      const owned=save.owned.includes(skin.id), active=save.skin===skin.id;
      const card=document.createElement('div');
      card.className='skin-card'+(active?' selected':'')+(!owned?' locked':'');
      const pv=document.createElement('canvas'); pv.width=64; pv.height=22;
      pv.style.cssText='border-radius:4px;display:block;background:#0d1830';
      const pc=pv.getContext('2d');
      for(let i=0;i<3;i++){
        const c=skin.id==='rainbow'?RAINBOW[i%RAINBOW.length]:(i===0?skin.head:skin.body);
        pc.fillStyle=c; pc.beginPath(); pc.roundRect(i*22+1,2,18,18,i===0?5:3); pc.fill();
      }
      const nm=document.createElement('div'); nm.className='skin-name'; nm.textContent=skin.name;
      const bg=document.createElement('span'); bg.className='skin-badge';
      if(active){bg.className+=' badge-active';bg.textContent='Actief';}
      else if(owned){bg.className+=' badge-owned';bg.textContent='Gekocht';card.addEventListener('click',()=>{save.skin=skin.id;writeSave(save);renderShop();});}
      else{bg.className+=' badge-buy';bg.textContent=`🪙 ${skin.price}`;card.addEventListener('click',()=>{
        if(save.coins<skin.price){alert(`Niet genoeg munten! Je hebt ${save.coins} 🪙`);return;}
        save.coins-=skin.price;save.owned.push(skin.id);save.skin=skin.id;writeSave(save);updateUI();renderShop();
      });}
      card.appendChild(pv); card.appendChild(nm); card.appendChild(bg);
      grid.appendChild(card);
    });
  }

  /* ════════════════════════════════════════════════════════════
     ACHIEVEMENTS RENDER
  ════════════════════════════════════════════════════════════ */
  function renderAch(){
    document.getElementById('ach-list').innerHTML=ACHIEVEMENTS.map(a=>{
      const u=save.achievements.includes(a.id);
      return `<div class="ach-row${u?' unlocked':''}">
        <div class="ach-icon">${u?a.icon:'🔒'}</div>
        <div class="ach-info"><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}</div></div>
        ${u?'<span style="color:var(--accent)">✓</span>':''}
      </div>`;
    }).join('');
  }

  /* ════════════════════════════════════════════════════════════
     SHARE
  ════════════════════════════════════════════════════════════ */
  function shareScore(){
    const n=save.name||'Ik';
    const tag=gameMode==='countdown'?' (60s)':gameMode==='hard'?' (hard mode)':'';
    const txt=`🐍 ${n} scoorde ${score} punten op level ${level}${tag} in Snake! Kan jij beter?`;
    if(navigator.share) navigator.share({title:'Snake Score',text:txt}).catch(()=>{});
    else navigator.clipboard.writeText(txt).then(()=>alert('Score gekopieerd! 📋')).catch(()=>alert(txt));
  }

  /* ════════════════════════════════════════════════════════════
     KEYBOARD
  ════════════════════════════════════════════════════════════ */
  const KP1={w:{x:0,y:-1},W:{x:0,y:-1},a:{x:-1,y:0},A:{x:-1,y:0},s:{x:0,y:1},S:{x:0,y:1},d:{x:1,y:0},D:{x:1,y:0}};
  const KP2={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};

  document.addEventListener('keydown',e=>{
    if(state==='playing'&&!paused){
      if(KP1[e.key]){
        e.preventDefault();
        const nd=KP1[e.key];
        if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
      }
      if(KP2[e.key]){
        e.preventDefault();
        const nd=KP2[e.key];
        if(gameMode==='multi'){if(nd.x!==-dir2.x||nd.y!==-dir2.y) nextDir2=nd;}
        else{if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;}
      }
    }
    if(e.code==='Space'){e.preventDefault();if(state==='playing')togglePause();else startGame();}
  });

  /* ════════════════════════════════════════════════════════════
     TOUCH (SWIPE + D-PAD)
  ════════════════════════════════════════════════════════════ */
  let tStart=null;
  canvas.addEventListener('touchstart',e=>{e.preventDefault();tStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(!tStart) return;
    const dx=e.changedTouches[0].clientX-tStart.x, dy=e.changedTouches[0].clientY-tStart.y;
    tStart=null;
    if(Math.abs(dx)<15&&Math.abs(dy)<15) return;
    const nd=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
    if(state!=='playing'){startGame();return;}
    if(paused){togglePause();return;}
    if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
  },{passive:false});

  function dpadPress(nd){
    if(state!=='playing'){startGame();return;}
    if(paused){togglePause();return;}
    if(nd.x!==-dir.x||nd.y!==-dir.y) nextDir=nd;
  }
  ({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}});
  ['up','down','left','right'].forEach(id=>{
    const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    document.getElementById('dpad-'+id).addEventListener('touchstart',e=>{e.preventDefault();dpadPress(map[id]);},{passive:false});
  });

  /* ════════════════════════════════════════════════════════════
     BUTTON WIRING
  ════════════════════════════════════════════════════════════ */
  document.getElementById('btn-start').addEventListener('click',startGame);
  document.getElementById('btn-pause').addEventListener('click',togglePause);
  document.getElementById('btn-share').addEventListener('click',shareScore);

  document.getElementById('btn-theme').addEventListener('click',()=>{
    dayMode=!dayMode;
    document.body.classList.toggle('day',dayMode);
    document.getElementById('btn-theme').textContent=dayMode?'🌙 Nacht':'☀️ Dag';
  });

  // Shop
  document.getElementById('btn-shop').addEventListener('click',()=>{renderShop();document.getElementById('shop-overlay').classList.add('open');});
  document.getElementById('shop-close').addEventListener('click',()=>document.getElementById('shop-overlay').classList.remove('open'));
  document.getElementById('shop-overlay').addEventListener('click',e=>{if(e.target.id==='shop-overlay')document.getElementById('shop-overlay').classList.remove('open');});

  // Leaderboard
  document.getElementById('btn-scores').addEventListener('click',openLB);
  document.getElementById('lb-close').addEventListener('click',()=>document.getElementById('lb-overlay').classList.remove('open'));
  document.getElementById('lb-overlay').addEventListener('click',e=>{if(e.target.id==='lb-overlay')document.getElementById('lb-overlay').classList.remove('open');});

  // Achievements
  document.getElementById('btn-achiev').addEventListener('click',()=>{renderAch();document.getElementById('ach-overlay').classList.add('open');});
  document.getElementById('ach-close').addEventListener('click',()=>document.getElementById('ach-overlay').classList.remove('open'));
  document.getElementById('ach-overlay').addEventListener('click',e=>{if(e.target.id==='ach-overlay')document.getElementById('ach-overlay').classList.remove('open');});

  // Mode & map tabs
  document.querySelectorAll('.tab-btn[data-mode]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn[data-mode]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); selectedMode=btn.dataset.mode;
    });
  });
  document.querySelectorAll('.tab-btn[data-map]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn[data-map]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active'); selectedMap=parseInt(btn.dataset.map);
    });
  });

  /* ════════════════════════════════════════════════════════════
     INIT
  ════════════════════════════════════════════════════════════ */
  updateUI();
  updatePauseBtn();
  drawGrid();
  ctx.fillStyle='#4ecca3'; ctx.font='bold 16px Courier New';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('Selecteer een modus en druk Start',W/2,H/2);
  </script>
</body>
</html>
